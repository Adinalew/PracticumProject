{% extends "core/base.html" %}
{% block content %}
    <div style="max-width: 700px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2 style="text-align: center;">Customize Your Study Review</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px;">
                    Generate Review
                </button>
            </div>
        </form>
    </div>
{% endblock %}
