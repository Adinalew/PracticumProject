{% extends "core/base.html" %}
{% block content %}
<style>
    .notebook-form-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background: #fffef0;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: 'Courier New', Courier, monospace;
        box-shadow: 1px 1px 4px rgba(0,0,0,0.1);
    }

    .notebook-form-container h2 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 20px;
    }

    .notebook-form-container form p {
        margin-bottom: 15px;
        line-height: 1.4;
    }

    .notebook-form-container button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
        font-size: 1rem;
        border-radius: 4px;
        cursor: pointer;
    }

    .notebook-form-container button:hover {
        background-color: #0056b3;
    }
</style>

<div class="notebook-form-container">
    <h2>📓 Customize Your Study Review</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="text-align: center; margin-top: 20px;">
            <button type="submit">Generate Review</button>
        </div>
    </form>
</div>
{% endblock %}
