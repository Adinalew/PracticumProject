<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .flashcards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .flashcard {
            perspective: 1000px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 200px;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard:hover .flashcard-inner,
        .flashcard:focus-within .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .flashcard-front {
            background-color: #ffffff;
            font-weight: bold;
            color: #333;
        }

        .flashcard-back {
            background-color: #f0f0f0;
            transform: rotateY(180deg);
            color: #555;
        }

        .no-flashcards {
            color: #888;
            font-size: 18px;
            margin-top: 20px;
        }

        .back-to-dashboard {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .back-to-dashboard:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Flashcards for {{ session.title }}</h1>

    {% if flashcards %}
        <div class="flashcards-grid">
            {% for card in flashcards %}
                <div class="flashcard" tabindex="0">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            {{ card.question }}
                        </div>
                        <div class="flashcard-back">
                            {{ card.answer }}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="no-flashcards">No flashcards available for this session.</p>
    {% endif %}

    <a href="{% url 'dashboard' %}" class="back-to-dashboard">Back to Dashboard</a>
</div>
</body>
</html>
