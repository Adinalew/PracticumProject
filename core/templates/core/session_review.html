{% extends "core/base.html" %}

{% block content %}
    <style>
        .review-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            font-family: 'Segoe UI', sans-serif;
        }

        .review-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .review-header h1 {
            margin: 0;
            font-size: 2rem;
            color: #333;
        }

        .review-meta {
            text-align: center;
            font-size: 0.95rem;
            color: #777;
            margin-bottom: 30px;
        }

        .review-section h2 {
            color: #4CAF50;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .review-text {
            background-color: #f8f8f8;
            padding: 20px;
            border-left: 5px solid #4CAF50;
            border-radius: 8px;
            line-height: 1.7;
            white-space: pre-wrap;
            font-size: 1.05rem;
        }

        .back-btn {
            display: block;
            margin: 30px auto 0;
            text-align: center;
        }

        .back-btn a {
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .back-btn a:hover {
            background-color: #45a045;
        }
    </style>

    <div class="review-container">
        <div class="review-header">
            <h1>📝 Session Review</h1>
        </div>

        <div class="review-meta">
            <p><strong>{{ session.title }}</strong> | Created: {{ session.created_at|date:"F j, Y, g:i a" }}</p>
        </div>

        <div class="review-section">
            <h2>AI-Generated Summary</h2>
            {% if review_text %}
                <div class="review-text">
                    {{ review_text|linebreaks }}
                </div>
            {% else %}
                <p>No review available.</p>
            {% endif %}
        </div>

        <div class="back-btn">
            <a href="{% url 'session_actions' session.id %}">← Back to Session</a>
        </div>
    </div>
{% endblock %}
